services:
  - type: web
    name: ai-codebase-analyzer-api
    env: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements-api.txt && python -c "from app.embedder import _load; _load()"
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app
      - key: MAX_CHUNKS
        value: "1500"
